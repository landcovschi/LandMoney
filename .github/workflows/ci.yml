name: CI

# `push` is narrowed to main on purpose, and the half worth knowing is what that
# costs: a branch with no open pull request gets no CI at all. It is the right
# trade here -- nobody commits to main and every change arrives through a pull
# request, so the only unchecked work is unfinished work -- but the first
# feedback now arrives when the pull request is opened, not when the branch is
# pushed. Waiting for a green tick before opening one is waiting forever.
#
# Putting `push` on every branch back would not be deduplicated by the
# concurrency block below. A push run and a pull_request run for the same commit
# carry different `github.ref` values -- refs/heads/<branch> against
# refs/pull/<n>/merge, which is what the checkout step actually resolves -- so
# they land in different groups and neither cancels the other. Two runs per
# commit is unavoidable with both triggers on, which is why one of them went.
on:
  push:
    branches: [main]
  pull_request:

# One run per branch. On a pull request a second push cancels the first: that
# answer was going to be superseded anyway, and a queued run nobody reads is a
# mark against a commit that no longer exists.
#
# On `main` it must not cancel, which is #38's fourth trap and the reason this
# is an expression rather than `true`. The `deploy` job below runs migrations
# against the deployed database and then replaces the running revision; a run
# cancelled between those two is worse than one that waits. A job-level
# `concurrency` block on `deploy` -- the answer #38 suggests -- does not fix it,
# because cancellation here happens at the level of the whole run and takes
# every job in it with it. Turning it off for pushes does fix it, and gets the
# queueing for free: without `cancel-in-progress`, a second run in the same group
# waits for the first, so two pushes to `main` deploy in order rather than at
# once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The floor, not the whole story. This is what every job gets unless it says
# otherwise, and `build` -- which compiles and tests and writes nothing anywhere
# -- wants exactly this. `publish` and `deploy` need more and ask for it in their
# own blocks, which is the fourth trap #24 names and the second trap #38 names,
# one file apart: a `packages: write` or an `id-token: write` written up here
# would hand the job that runs `npm ci` and `dotnet test` a token that can push
# images, or mint an Azure login, for no reason other than that it was convenient
# to type once.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub's default is six hours. Nothing here takes a minute, and the ways
    # past it are ordinary rather than exotic: npm ci against a stalled
    # registry, a hung test, a runner that loses its network. The minutes are
    # free on a public repository, so the cost of the default is not money -- it
    # is a required check sitting in progress for hours, with the pull request
    # neither mergeable nor honestly abandonable.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # The version comes from the file the client already carries, so there is
      # one place to change it rather than two that drift. The path is relative
      # to the repository root: `working-directory` below applies to `run` steps
      # and does not reach the inputs of an action.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/landmoney.client/.nvmrc

      # `ci` and not `install`: it installs exactly the lock file and fails when
      # package.json disagrees with it, where `install` quietly rewrites the lock
      # and makes the build depend on when it last ran.
      #
      # .npmrc sets engine-strict, so a Node major outside the `engines` range
      # fails here rather than printing a warning and building anyway.
      - name: Install client dependencies
        working-directory: src/landmoney.client
        run: npm ci

      # `npm run build` is `tsc -b && vite build`: it type-checks and bundles,
      # and has no opinion about lint rules. So without this step the one check
      # the client has that a compiler does not perform is the one check CI does
      # not perform either, and .oxlintrc.json has been enforced exactly once,
      # by hand, in #4.
      #
      # Before the build because the cheaper check should fail first: oxlint is
      # a single binary over twenty files and finishes in about a second.
      - name: Lint client
        working-directory: src/landmoney.client
        run: npm run lint

      # Writes straight into src/LandMoney.Web/wwwroot -- see vite.config.ts.
      # Nothing below reads it: `dotnet build` does not look at wwwroot. It is
      # #23, where `dotnet publish` does, that makes this order load-bearing.
      - name: Build client
        working-directory: src/landmoney.client
        run: npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Nothing in this workflow runs `dotnet ef`. What this step checks is that
      # dotnet-ef, pinned to 10.0.10 with rollForward disabled, still restores on
      # a machine that is not the one it was pinned on -- which is the whole of
      # what slice 2 is for.
      - name: Restore .NET tools
        run: dotnet tool restore

      # The solution and not the web project: `dotnet test --no-build` needs the
      # test project built too, and a build that missed it fails down there with
      # a message about the project not being built -- which reads like a broken
      # test project rather than a missing argument up here.
      - name: Restore
        run: dotnet restore LandMoney.slnx

      - name: Build
        run: dotnet build LandMoney.slnx --no-restore -c Release

      # -c Release has to match the build above. Without it `--no-build` looks in
      # bin/Debug, finds nothing, and reports that same misleading message.
      - name: Test
        run: dotnet test LandMoney.slnx --no-build -c Release

      # -----------------------------------------------------------------------
      # The migration bundle -- #37.
      #
      # This is how the schema reaches the deployed database: a single
      # executable produced from this commit, which is run against Azure as a
      # deployment step. Nothing calls Database.Migrate() at startup, and
      # Program.cs says why beside the DbContext registration.
      #
      # It is built in `build` rather than in a job of its own so that every
      # pull request proves the bundle still builds. That is not free -- it is
      # the slowest step here, about 20 seconds -- and it is worth it because
      # the ways this breaks are all invisible until someone deploys: a
      # migration that does not compile, a provider that cannot be resolved at
      # design time, an SDK that no longer produces a linux-x64 apphost.
      # -----------------------------------------------------------------------
      - name: Build the migration bundle
        env:
          # Both of these are the same trap wearing two hats, and it is the one
          # #37 did not predict: `dotnet ef` starts the application's host to
          # find the DbContext, so Program.cs runs -- including the line that
          # throws when ConnectionStrings:Default is missing. Nothing connects
          # here; the string only has to exist and parse.
          #
          # It does not fail on a developer machine, which is why it has to be
          # said out loud. `dotnet ef` applies the first profile in
          # launchSettings.json, that profile sets ASPNETCORE_ENVIRONMENT to
          # Development, and Development is what loads user-secrets. A runner
          # has no user-secrets, so the same command that works locally answers:
          #
          #   Error: ConnectionStrings:Default is not set.
          #   Unable to create a 'DbContext' of type 'AppDbContext'.
          #
          # Production is set explicitly rather than left to that profile, so
          # this step reads the same configuration a deployed process would.
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Default: "Host=build-time-only;Database=none;Username=none;Password=none"

        # `-r linux-x64 --self-contained` is what makes the file runnable where
        # it is run rather than where it was built. Without the runtime
        # identifier this produces a Windows executable on Windows and a
        # format error wherever it lands; without --self-contained it needs a
        # .NET runtime installed beside it, which is a dependency the deploy
        # step should not have to arrange. The price is measured: 33 MB
        # framework-dependent against 128 MB self-contained.
        #
        # No --no-build. The build above compiled the solution for this
        # machine's own runtime; this needs a linux-x64 publish of a generated
        # project that references the app, so there is nothing here for
        # --no-build to reuse.
        run: >
          dotnet ef migrations bundle
          --project src/LandMoney.Web
          --configuration Release
          --self-contained
          -r linux-x64
          -o efbundle
          --force

      # The step that would have caught the failed deploy of #57, and the reason
      # it is worth a whole step rather than a comment.
      #
      # `efbundle` runs Program.cs to find the DbContext. In the deploy job it
      # runs from a directory holding nothing but itself -- no appsettings.json --
      # so every `?? throw` in Program.cs for a key whose default lives in that
      # file is a landmine that goes off at deploy time. #57 added one for
      # Categorizer:BaseUrl and the deploy died at "Apply migrations".
      #
      # Building the bundle cannot catch it, which is the structural half:
      # the step above runs inside the checked-out source tree, where
      # appsettings.json exists and every key resolves. The bundle only meets the
      # bare directory when it is RUN. So `build` was green and `deploy` was red,
      # and that is not luck -- it is where the two environments differ.
      #
      # `cd` into an empty directory is the whole trick: it reproduces the deploy
      # job's filesystem exactly. The host is deliberately unresolvable, so this
      # needs no database, no service container and no network, and it cannot
      # touch anything real.
      #
      # The assertion is on WHICH failure. The bundle is expected to fail -- it
      # cannot reach `build-time-only` -- and the two failures look alike from a
      # distance:
      #
      #   host built, could not connect  ->  "No such host is known."       PASS
      #   host would not build           ->  "Unable to create a 'DbContext'" FAIL
      #
      # So the exit code says nothing useful and is ignored on purpose; the
      # message is the signal. `set +e` is needed because the shell is `bash -e`
      # and a non-zero exit is the expected outcome here.
      - name: The bundle must start without appsettings.json
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Default: "Host=build-time-only;Database=none;Username=none;Password=none"
        run: |
          mkdir -p bundle-smoke
          cp efbundle bundle-smoke/
          cd bundle-smoke

          set +e
          output=$(./efbundle 2>&1)
          set -e
          echo "$output"

          if grep -q "Unable to create a 'DbContext'" <<<"$output"; then
            echo "::error::efbundle could not build the application host with no \
          appsettings.json present, which is exactly how it runs in the deploy job. \
          The cause is almost always a new required-configuration throw in Program.cs \
          for a key whose default lives in appsettings.json. See the comment above \
          this step."
            exit 1
          fi

          echo "The host built; the bundle failed at connecting, which is the expected outcome."

      # v7, checked rather than remembered -- from memory this would have been
      # v4, which is the third time that lesson has been paid for after #22 and
      # #24.
      #
      # One artifact per run, with no SHA in the name: the run already names the
      # commit, and #38 downloads it from its own run rather than searching for
      # it by name. Seven days because this is a build check and a deployment
      # input, not an archive -- a bundle worth running again is a bundle whose
      # commit can be built again.
      #
      # The trap on the other end: an artifact is a zip, and a zip does not
      # carry the executable bit. Whatever downloads this has to `chmod +x`
      # before running it, or the failure is `Permission denied` on a file that
      # is plainly there.
      - name: Upload the migration bundle
        uses: actions/upload-artifact@v7
        with:
          name: efbundle
          path: efbundle
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish the image to ghcr.io -- #24, and the end of slice 2.
  #
  # ghcr.io rather than Azure Container Registry: the same job, but ACR Basic is
  # around 5 USD a month and GitHub's registry is free for a public repository.
  # The money is the smaller half. The larger one is that this needs no
  # credentials of its own -- see the login step -- and slice 3 has to hand
  # whatever this uses to Azure.
  # ---------------------------------------------------------------------------
  publish:
    # Only after the tests pass. `needs` is what makes this a second job rather
    # than four more steps on `build`: a failed test must stop the push, and a
    # step added to `build` would also run on every pull request.
    needs: build

    # `push` is narrowed to `[main]` at the top of the file, so this reads as
    # "pushes to main" even though it does not say `main` anywhere -- and it
    # keeps saying that if the branch is ever renamed.
    #
    # Why not pull requests, beyond not wanting the noise: `pull_request` builds
    # `refs/pull/<n>/merge`, a merge commit that exists only inside the run. Its
    # SHA tag would name a commit no clone can check out, which is the exact
    # property the SHA tag exists to provide.
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    # Longer than `build`'s 10. A cold cache here is npm ci, dotnet restore and
    # two compilers inside a docker build, where `build` gets to use the
    # runner's preinstalled toolchains.
    timeout-minutes: 15

    # Job level, and this is the fourth trap #24 names. Two things about it:
    #
    # A job-level `permissions` block *replaces* the workflow-level one rather
    # than adding to it, so `contents: read` has to be restated or the checkout
    # below loses its token. That is also what makes writing it here correct --
    # `packages: write` at the top of the file would silently reach `build`.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Required rather than decorative. `cache-to: type=gha` below is a buildx
      # cache exporter, and the default `docker` driver has no exporters at all:
      # without this step the build succeeds, the push succeeds, and the cache
      # is never written -- a failure whose only symptom is that the next run is
      # not any faster. This installs the `docker-container` driver that can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN, scoped by the `packages: write` above and dead when the
      # run ends. No personal access token, nothing in repository secrets, and
      # nothing for anyone to rotate.
      #
      # `github.actor` is who pushed, not who owns the package; the registry
      # authorises on the token, and the username only has to be non-empty.
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # `github.repository` is `landcovschi/LandMoney`, and #24's second
          # trap is that this is a valid repository name and an invalid image
          # name -- image name components are lowercase only. It is safe here
          # and nowhere else: this action promises to "Lowercase the image name"
          # (its README), producing ghcr.io/landcovschi/landmoney. One line
          # outside it the trap is live, measured rather than assumed:
          #
          #   $ docker build -t ghcr.io/landcovschi/LandMoney:local-24 .
          #   ERROR: failed to build: invalid tag
          #   "ghcr.io/landcovschi/LandMoney:local-24": repository name must be
          #   lowercase
          #
          # So nothing in this job names the image except through the `meta`
          # outputs below.
          images: ghcr.io/${{ github.repository }}

          # `format=long` is the full 40 characters -- `sha-<40>` -- where the
          # default `format=short` is `sha-<7>`. The long form is the one that
          # goes into `git show` without ambiguity and reads as an identity
          # rather than an abbreviation.
          #
          # `latest` is for `docker run` by hand and is deliberately not what
          # gets deployed: #24's third trap, and it is about reasoning rather
          # than safety. `latest` cannot be rolled back to, because there is no
          # older `latest` to roll back to -- slice 3 deploys the SHA tag, or
          # the digest this job prints at the end.
          #
          # `{{is_default_branch}}` rather than leaning on the `if:` above,
          # because the rule about which branch gets `latest` should be legible
          # where the tag is written.
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          # The repository root, so .dockerignore applies -- which is the file
          # that keeps the local wwwroot and appsettings.Development.json out of
          # the image. Both are git-ignored, so neither is in a fresh checkout
          # and neither can leak from a runner; the exclusions matter for a
          # build on this machine and are inherited here for free.
          context: .

          # `labels` is not cosmetic and is the reason the package appears under
          # the repository rather than orphaned at the account level:
          # metadata-action derives org.opencontainers.image.source from
          # `github.repository`, and ghcr.io reads that label to link the two.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

          # mode=max rather than the default min, and for this Dockerfile the
          # difference is most of the point. `min` exports only the layers of
          # the final stage -- which here is `COPY --from=build` and little
          # else. The expensive layers, `npm ci` and `dotnet restore`, live in
          # the two stages that get discarded, so `min` would cache nothing that
          # costs anything.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest, not the tag, is the thing that cannot be moved: a tag is a
      # name someone can repoint, and `@sha256:...` is the image itself. Written
      # to the run summary so that verifying this -- pull it on a machine that
      # has never logged in -- is a copy rather than a hunt through the log.
      - name: Report what was published
        run: |
          {
            echo '### Published to ghcr.io'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo 'digest: ${{ steps.push.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deploy to Azure -- #38, and the last step of slice 3.
  #
  # Nothing here is new. Every command below is one from docs/deploy-azure.md
  # that already ran by hand in #35, #36 and #37, which is why those went first:
  # a deployment written straight into a workflow fails inside a runner where
  # nothing can be inspected. What is new is that nobody types them.
  #
  # The order is #37's and it is load-bearing -- migrate, then replace the
  # revision. In the gap the *old* revision runs against the *new* schema, which
  # is safe while every migration only adds. The other order puts the new
  # revision against the old schema, which for an added column is a query naming
  # a column that is not there. Neither order saves a rename; that needs
  # expand-and-contract, and nothing here does yet.
  # ---------------------------------------------------------------------------
  deploy:
    # `publish` alone would order this correctly -- it already needs `build`, and
    # a job whose dependency was skipped is skipped too. `build` is named anyway
    # because the migration bundle comes from there, and a `needs` list is the
    # only place that dependency is written down.
    needs: [build, publish]

    # The same expression as `publish`, and redundant for the reason just given:
    # if `publish` is skipped this is skipped. Kept because "deploys on pushes to
    # main" should be legible in the job that deploys rather than inferred two
    # jobs away.
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    # Longer than the others, and it is the cold start that sets the floor:
    # `containerapp update` provisions a revision, and #35 measured 23.3 s from
    # zero. Twenty minutes is not a target -- it is the point at which something
    # has hung, and a stuck deployment should be reported rather than waited on.
    timeout-minutes: 20

    # #38's second trap, which is #24's fourth wearing different clothes. A
    # job-level block replaces the workflow-level one rather than adding to it,
    # so `contents: read` is restated -- `download-artifact` resolves a token
    # from it -- and `id-token: write` stays down here, in the only job that has
    # any business minting an Azure login.
    permissions:
      contents: read
      id-token: write

    # The names from docs/deploy-azure.md, in one place rather than five. IMAGE
    # is written out in lower case rather than built from `github.repository`,
    # which is #24's second trap and is live everywhere except inside
    # `metadata-action`: `ghcr.io/landcovschi/LandMoney` is a valid repository
    # name and an invalid image name, and nothing here sanitizes it.
    env:
      RESOURCE_GROUP: rg-landmoney
      CONTAINER_APP: landmoney
      IMAGE: ghcr.io/landcovschi/landmoney

    steps:
      # No `actions/checkout` in this job, which answers #38's third trap rather
      # than meeting it: the bundle is an artifact of this same run, so the
      # commit that built it and the commit whose image is deployed below are the
      # same by construction. A checkout could differ from both.
      #
      # v8 while the upload one job up is v7 -- the two are versioned
      # independently and both are current, checked rather than remembered. They
      # still agree: v7 skips zipping only when `archive: false` is set, and it
      # is not, so v8's new "check the Content-Type before unzipping" unzips.
      - name: Download the migration bundle
        uses: actions/download-artifact@v8
        with:
          name: efbundle

      # No client secret anywhere, which is the whole of #38. These three ids are
      # `vars` and not `secrets` on purpose: they identify an app registration,
      # they are not a credential, and storing them as secrets would suggest
      # there is something here to leak. What authorises the login is a token
      # minted for this run by GitHub and traded for an Azure one -- scoped to
      # this repository on this branch, and dead when the job ends.
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `containerapp` is an extension, and az installs one on first use only
      # after asking. A runner cannot answer, so this line is here for the reason
      # step 9 of the runbook gives for the same line: it keeps an interactive
      # prompt out of the middle of a deployment.
      - name: Install the containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # ----------------------------------------------------------------------
      # The schema first. #37's shape, unchanged -- step 13 of
      # docs/deploy-azure.md is what each line answered when it ran by hand.
      # ----------------------------------------------------------------------
      - name: Apply migrations
        run: |
          # Read back out of the Container Apps secret the running app already
          # uses, rather than stored a second time in GitHub. #37 names the trap:
          # a deployment needs this string, and two places holding one password
          # is how they drift. There is still exactly one, and rotating it stays
          # a single `az containerapp secret set`.
          conn=$(az containerapp secret show \
            --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --secret-name pgconn --query value -o tsv --only-show-errors)

          # Before anything can echo it. A `run` block does not trace its own
          # commands, so the value has not been printed yet -- this is for
          # whatever gets added below by someone debugging at a bad moment.
          echo "::add-mask::$conn"

          # An artifact is a zip, and a zip carries no executable bit. Without
          # this the answer is `Permission denied` on a file that is plainly
          # sitting there.
          chmod +x ./efbundle

          # By environment variable and never by `--connection`, although that
          # argument exists and is the first thing the bundle's own --help lists:
          # an argument is visible in the process list. The bundle runs the
          # application's own configuration pipeline, so ConnectionStrings__Default
          # reaches it exactly the way it reaches the app.
          #
          # No `docker run` wrapper, unlike the runbook. That exists there
          # because the bundle is a linux-x64 ELF binary and the machine holding
          # it runs Windows. Here the runner is the platform it was built for.
          ConnectionStrings__Default="$conn" ./efbundle

      # ----------------------------------------------------------------------
      # Then the revision.
      # ----------------------------------------------------------------------
      #
      # The SHA tag, never `latest` -- #24's third trap and #35's. `github.sha`
      # on a push is the commit that was pushed, and `metadata-action`'s
      # `type=sha,format=long` one job up tagged the image with exactly that, so
      # the two cannot disagree about which commit is being deployed.
      #
      # `update` and not `create`: revisions are immutable, so this makes a new
      # one and leaves the previous one deactivated rather than deleted. That is
      # what a rollback targets, and `revision list --all` is where to find it.
      - name: Deploy the revision
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --image "$IMAGE:sha-${{ github.sha }}" \
            --output none --only-show-errors

      # A deployment that reports success while the site is down is the exact
      # failure this slice exists to remove, so the job does not end at
      # `update`. Two questions, both asked of Azure rather than of this file:
      # what image is the app running, and does it answer.
      - name: Check what is running
        run: |
          fqdn=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --query "properties.configuration.ingress.fqdn" -o tsv --only-show-errors)
          image=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP" \
            --query "properties.template.containers[0].image" -o tsv --only-show-errors)

          expected="$IMAGE:sha-${{ github.sha }}"
          if [ "$image" != "$expected" ]; then
            echo "::error::the app is running $image, expected $expected"
            exit 1
          fi

          # /api/transactions rather than /, because it is the one that proves
          # more than the container started: it reaches Postgres, so a wrong
          # connection string or an unapplied migration fails here rather than
          # at whatever hour someone next opens the page.
          #
          # --max-time 60 rather than curl's default, which is none, and it is
          # sized against the cold start -- 23.3 s from zero, measured in #35.
          # Retried because `containerapp update` returns when the revision is
          # provisioned, which is earlier than when it is serving; without this
          # the deployment is correct and the check is a coin flip. `|| true`
          # because the shell here runs under -e and a curl that times out would
          # otherwise take the job with it before the retry.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "https://$fqdn/api/transactions") || true
            [ "$code" = "200" ] && break
            echo "attempt $attempt: $code"
            sleep 10
          done

          if [ "$code" != "200" ]; then
            echo "::error::GET https://$fqdn/api/transactions answered $code"
            exit 1
          fi

          {
            echo '### Deployed'
            echo
            echo "- image: $image"
            echo "- url: https://$fqdn/"
            echo "- GET /api/transactions: $code"
          } >> "$GITHUB_STEP_SUMMARY"
