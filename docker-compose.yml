# Local infrastructure for development.
#
# The pgvector/pgvector image is plain Postgres plus the vector-search
# extension. Chosen now so that slice 5 does not force recreating the volume
# later; until then the extension simply sits there unused.
#
# **Two ways to bring this up, added in #39.**
#
#   docker compose up -d                  postgres + categorizer
#   docker compose --profile full up -d   ... and the .NET app as well
#
# The default is the everyday loop: the two things the application talks to,
# with the application itself run from the host by `dotnet run`, which is where
# the debugger and the fast rebuild are. The categorizer is published on
# 127.0.0.1:8000, which is what appsettings.json points at, so nothing has to be
# configured for that.
#
# The `full` profile is the whole stack in containers, and it is what #39's
# acceptance test needs -- it is the only arrangement in which the app reaches
# the categorizer **by service name** rather than through a published port. A
# service with `profiles:` is skipped entirely unless its profile is named, so
# the default `up` does not build the .NET image and the everyday loop costs
# what it always did.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: landmoney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-landmoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landmoney_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-landmoney}
    ports:
      # Bound to localhost only. Without the 127.0.0.1 prefix Docker publishes
      # on every interface and punches straight through the Windows firewall.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Container started" and "database accepts queries" are different
      # events. Without this the first connection loses that race.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-landmoney} -d ${POSTGRES_DB:-landmoney}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The Python categorizer -- #39. The rules baseline of #25 behind one endpoint.
  categorizer:
    build:
      # The context is the service's own folder, not the repository root, which
      # is the opposite of the app below. Right for the opposite reason: the
      # .NET image has to reach src/landmoney.client, and nothing here reaches
      # outside src/categorizer. `evals/` is deliberately not in this context --
      # the scorer imports the service, never the other way round.
      context: ./src/categorizer
    container_name: landmoney-categorizer
    restart: unless-stopped
    environment:
      # **#59, and the default is the point.** `rules` unless asked otherwise, so
      # the everyday `docker compose up` costs nothing and CI stays free. Set
      # CATEGORIZER_PREDICTOR=model in `.env` for a session that wants the model;
      # an unrecognised value stops the container rather than quietly serving the
      # baseline under the model's name.
      CATEGORIZER_PREDICTOR: ${CATEGORIZER_PREDICTOR:-rules}

      # Read from `.env`, which is git-ignored and which nothing in this repository
      # may print. Empty when it is absent, which is correct: the `rules` path never
      # looks at it, and the `model` path fails its first call and answers with no
      # category -- the fallback of #39, with a model behind the port.
      #
      # Deployed there is no key at all: the categorizer runs in Azure since #61,
      # as its own container app, and it is pinned to CATEGORIZER_PREDICTOR=rules
      # there -- the model would be one Claude call per saved transaction. The day
      # that changes, the key is a Container Apps secret referenced by name, the
      # same road the connection string takes (#36).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # #64. Unset by default, and empty is the same as unset: the per-call log
      # line then reports tokens and `cost_usd=unpriced`. There is no default in
      # code on purpose -- a price moves without this repository noticing, and a
      # confident stale figure is worse than a missing one. `.env.example` carries
      # today's published rate to copy in.
      CATEGORIZER_PRICE_INPUT_PER_MTOK: ${CATEGORIZER_PRICE_INPUT_PER_MTOK:-}
      CATEGORIZER_PRICE_OUTPUT_PER_MTOK: ${CATEGORIZER_PRICE_OUTPUT_PER_MTOK:-}
    ports:
      # Published so the host's `dotnet run` can reach it, and bound to
      # 127.0.0.1 for the same reason postgres is. The app *container* does not
      # use this port at all -- it goes over the compose network by name.
      - "127.0.0.1:${CATEGORIZER_PORT:-8000}:8000"
    healthcheck:
      # Declared in the Dockerfile; repeated here only for the timings, because
      # `depends_on: condition: service_healthy` below is what reads them. The
      # image has no curl, wget or nc -- python:3.13-slim is as bare as the
      # aspnet one -- so the check is the interpreter that is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  # The .NET application, behind the `full` profile -- see the header.
  app:
    profiles: ["full"]
    build:
      # The repository root, because the Dockerfile's node stage builds the
      # client out of src/landmoney.client and writes it into the server
      # project's wwwroot. That coupling is #20's written-down price, and this
      # is the second place it is charged.
      context: .
    container_name: landmoney-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      # Two underscores. One makes a key nobody reads -- README.md says so about
      # the deployed app, and it is the same provider here.
      #
      # Host=postgres: the service name, resolved by the compose network's DNS.
      # 127.0.0.1:5433 is what the *host* uses; inside this container 127.0.0.1
      # is the container itself.
      #
      # SslMode=Disable, which the deployed app must never have. Here both ends
      # are on a private bridge network on one machine and there is no
      # certificate to validate; the deployed connection string carries
      # SslMode=Require and is a Container Apps secret. That difference is the
      # cost CLAUDE.md names for having two Postgres instances -- "it works
      # locally" and "it works deployed" stopped being the same sentence in #34.
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-landmoney};Username=${POSTGRES_USER:-landmoney};Password=${POSTGRES_PASSWORD:-landmoney_local_only};SslMode=Disable;Timeout=15;CommandTimeout=30

      # **The line #39 is about.** `categorizer` is the service name above;
      # `localhost` here would be this container, where nothing is listening.
      # It is the first place in this project where the two words differ.
      Categorizer__BaseUrl: http://categorizer:8000

      # Explicit although Production is already the default with nothing set --
      # the same reasoning as the deployed app, where it gates
      # UseExceptionHandler, UseHsts, UseHttpsRedirection and
      # UseForwardedHeaders. Running the image locally is only worth anything if
      # it takes the same branch the deployed one does.
      #
      # Expect one warning per start that the deployed app does not produce:
      # "Failed to determine the https port for redirect". There is no ingress
      # here to send X-Forwarded-Proto, so UseHttpsRedirection is back to being
      # a no-op by degradation rather than by design -- exactly the state
      # CLAUDE.md describes for the image before #36.
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
      categorizer:
        # Not strictly required -- the app starts perfectly well without the
        # categorizer and stores transactions with no category, which is the
        # fallback #39 asks for and the thing its acceptance test checks by
        # stopping this service. It is here so that a fresh `up` does not
        # produce a first transaction that is uncategorised for a reason nobody
        # would think to look for.
        condition: service_healthy

    # No healthcheck on this service, and it is not an oversight. The aspnet
    # runtime image has none of curl, wget, nc or ping -- measured in #23 -- so
    # a check would mean an apt layer in the image that ships, to serve a
    # dependency nothing has: nothing waits on the app. Container Apps ignores a
    # Dockerfile healthcheck anyway and probes over HTTP from outside.

volumes:
  pgdata:
